<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADRIP | Private Jeweler</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --luxury-gold: #9e8153; 
            --deep-vault: #030303;
        }

        body {
            background-color: var(--deep-vault);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            color: #fff;
            /* Hairline structural frame */
            box-shadow: inset 0 0 0 20px var(--deep-vault), 
                        inset 0 0 0 21px rgba(158, 129, 83, 0.2);
            box-sizing: border-box;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Subtle velvet micro-grain overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.03;
            pointer-events: none;
            z-index: 2;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.95' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .container {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 290px; 
            padding: 10px;
            text-align: center;
        }

        /* Pure Typographic Logo Mark */
        .brand-logo-text {
            color: #fff;
            font-size: 3rem;
            font-weight: 300;
            margin: 0;
            letter-spacing: 12px; 
            text-transform: lowercase;
            line-height: 1;
            padding-left: 12px; 
        }

        .brand-subtitle {
            text-transform: uppercase;
            font-size: 0.5rem;
            font-weight: 400;
            letter-spacing: 5px;
            margin: 15px 0 45px;
            color: rgba(255,255,255,0.4);
        }

        .divider {
            height: 1px;
            width: 25px;
            background: var(--luxury-gold);
            margin: 0 auto 45px;
            opacity: 0.3;
        }

        .section-label {
            color: var(--luxury-gold);
            text-transform: uppercase;
            font-size: 0.5rem;
            font-weight: 500;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .master-name {
            font-size: 1.25rem;
            font-weight: 100; 
            margin-bottom: 45px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.9);
        }

        .capsule-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px 10px;
            margin-bottom: 55px;
        }

        .capsule-item {
            font-size: 0.7rem;
            font-weight: 300;
            color: rgba(255,255,255,0.5);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .market-claim {
            font-size: 0.65rem;
            letter-spacing: 4px;
            color: var(--luxury-gold);
            text-transform: uppercase;
            margin-bottom: 35px;
            font-weight: 400;
        }

        .cta-instruction {
            font-size: 0.5rem;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.3);
            margin-bottom: 18px;
            text-transform: uppercase;
        }

        .btn-primary {
            background: #fff;
            color: #000;
            border: none;
            padding: 18px 10px;
            width: 100%;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.7rem;
            cursor: pointer;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
            transition: background-color 0.3s ease;
        }

        .btn-primary:active {
            background-color: rgba(255, 255, 255, 0.85);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="brand-logo-text">adrip</div>
        
        <div class="brand-subtitle">Bespoke Dental Art & Fine Jewelry</div>
        
        <div class="divider"></div>

        <div class="section-label">Private Jeweler</div>
        <div class="master-name">Ashton Coates</div>

        <div class="capsule-grid">
            <div class="capsule-item">Custom Grillz</div>
            <div class="capsule-item">VVS+ Setting</div>
            <div class="capsule-item">Private Commissions</div>
            <div class="capsule-item">Restoration</div>
        </div>

        <div class="market-claim">Private Commissions Only</div>

        <div class="cta-instruction">By Appointment Only</div>

        <a href="tel:8436234469" class="btn-primary">Book Private Consultation</a>
    </div>

</body>
</html>
